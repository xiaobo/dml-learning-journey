# DML Schema

# 从概念到实现的全流程支持：将 DML 嵌入到 YAML 形式的需求文档中，逐步细化逻辑，调整需求文档，使其逐步满足 DML 规范
# a）一般来说，需要先定义再引用，但在同一文件中的 datasets 之间不要求严格顺序，measures 之间也不要求严格顺序，同一 dataset 内的各字段之间不要求严格顺序
# b) 对带有 DML 标签的节点进行 schema 校验
# c) 随时输出工作列表（TODO标签和被引用，但是尚未定义的datasets，measures，columns，filters）
# d) 校验层级:
#    DML 片段通过 schema 校验
#    依赖的变量都有完整定义，且没有待处理项目（如TODO标签）
#    可生成有效SQL
#    生成的SQL中的逻辑和已有SQL日志中的逻辑一致
#    SQL运行结果得到验证

# ── Dimension 语言模型 ──
#   dimension field:             一个有名称的 DML field
#   dimension:                   由一个或多个 dimension fields 组成的列表
#   dataset.dimension:           dataset dimension；完整字段值组合声明 source-row identity
#   query.columns.dimension:     query dimension；决定查询 GROUP BY 和结果行含义
#   materialize.dimension:       materialization dimension；决定物化分组和 key
#   measure.dimensions:          allowed dimensions；外层列表包含候选，内层每个列表是一个 dimension
#   {m: {dimension: [...]}}:     替换一个 measure reference 的 evaluation dimension
#   dimensions[dt]: / dim_dt:    时间元数据 / 当前 query 的活动时间 dimension field

$id: "#/definitions/dml_schema"
$schema: "http://json-schema.org/draft-07/schema#"
# x-dml-alias: scalar is another name surface of the enclosing anchor; { target: enclosing_anchor, "on": scalar }
# x-dml-model-query: reference roles for Model Query SQL; Java retains tokenization and ranges.
x-global-object-name-pattern: &global_object_name_pattern "^(?!(?:includes|column-macros|datasets|columns|dimensions\\[dt\\]|measures|dt-macros|fn-macros|materializes|queries|dimensions|dialects|include|column-macro|dataset|column|measure|dt-macro|fn-macro|materialize|query|dimension|dialect|named_sql)$).+$"
x-dml-global-object-type-dispatch: "#/definitions/dml_global_object_by_type"
x-dml-derived-columns:
    scope: enclosing_dataset
    rules:
        - source: dt_date
          targets: [ dt_week, dt_month, dt_quarter, dt_year ]
# x-dml-anchor:    mapping key defines a symbol — { kind, "on": mapping_key, datasets? }
# x-dml-reference: value/item references a symbol — { role, target_kinds, on, datasets?, scope? }
#   target_kinds contains exact canonical lower_snake SymbolKind values; DML object type discriminators remain separate.
#   Dataset and query scope are independent metadata and never hide inside target-kind vocabulary.
#   unresolved: authoritative prevents compatibility lookup when a canonical fact does not bind.
# x-dml-context:   explicit property/completion context for an object without its own type property
# x-dml-value-context: scalar value-assistance context; does not change symbol-site context
# x-dml-column-datasets: parent scope for column_name — { datasets: { from: enclosing_object_key | sibling_property } }
#   sibling_property also declares its value surface with "on": scalar | sequence_item.
#   dataset.columns → datasets: enclosing dataset mapping key
#   column-macros.{ds} → datasets: that scope mapping key
#   column-macros.columns → datasets: sibling column-macros.datasets[] (all scoped datasets)
# format: formula → formula-token refs in string values; disambiguate by enclosing path + lookup order
#   match_values limits a rule to exact runtime literals; modifier_target marks a
#   formula reference whose nested children are modifier uses of that target.
#   ordinary tokens resolve only to the formula site's declared column/measure/query roles;
#   dt/fn macros are modifier-position references declared by dmx_variable_schema.yaml
# dataset.sql on: sql_curly_token → each {name} in the SQL scalar is a dataset_name reference
#   (skip_values excludes the QUERY sentinel); not format: formula
# Roles: include_path | dataset_name | column_name | measure_name | query_output_source | materialize_name | query_column | filter_name
# query.filters.{name} defines filter_name; measure {+f: name} / {-f: name} references it (same query scope).
# When a filter has no explicit column: property, its key also names the filtered column
# (when: { implicit_column_from_key: column }).
#
# resolveMeasureDatasets(measureName):
#   atomic_measure under dataset → enclosing_object_key, or explicit measure.dataset if set
#   top-level measure with dataset: → [dataset]
#   composite measure (no dataset:) → union resolveMeasureDatasets(each formula_curly measure_name ref), cycle-safe
#
# resolveColumnDatasets(site):
#   if sibling dataset: present → [dataset]
#   else collect schema-path dataset_sources (below), then union their canonical dataset closure
#
# dataset_sources by parent type (see x-column-datasets-* anchors):
#   materialize → sibling.measures[]
#   query (aggregate) → empty output keys plus formula tokens under sibling.columns; filters are excluded by path
#   measure (composite) → enclosing_object_key (parent measure)
# Dataset scope anchors (compiled fail-fast metadata; referenced via YAML alias *col_ds_*):
x-column-datasets-materialize: &col_ds_maz
    from: sibling_property
    key: dataset
    "on": scalar
    fallback:
        dataset_sources:
            - { from: sibling_property, key: measures, role: measure_name, "on": sequence_item }
        resolve_measure_datasets: recursive
        aggregate: union
x-column-datasets-query: &col_ds_query
    from: sibling_property
    key: dataset
    "on": scalar
    fallback:
        dataset_sources:
            - { from: sibling_property, key: columns, role: query_output_source, "on": mapping_key, exclude_keys: [dimension] }
            - { from: sibling_property, key: columns, role: measure_name, "on": formula_token }
        resolve_measure_datasets: recursive
        aggregate: union
x-column-datasets-measure: &col_ds_measure
    from: sibling_property
    key: dataset
    "on": scalar
    fallback:
        dataset_sources:
            - { from: enclosing_object_key, role: measure_name }
        resolve_measure_datasets: recursive
        aggregate: union
x-column-datasets-enclosing: &col_ds_enclosing
    from: enclosing_object_key

x-dml-formula-functions:
    kind: dml_function
    role: dml_function
    "on": function_call
    names: [ AGG, DIVIDE, DISTINCTCOUNT, SUMIF, COUNTIF, DISTINCTCOUNTIF, MAXIF, MINIF, AVGIF ]

x-dml-measure-target-kinds: &measure_target_kinds [ measure, atomic_measure ]

x-dml-model-query:
    measure-reference:
        function: AGG
        argument: 0
        forms:
            identifier: { case-sensitive: false }
            modifier_expression: { case-sensitive: true }
        role: measure_name
        target_kinds: *measure_target_kinds
    column-reference:
        role: column_name
        target_kinds: [ column_name ]
    result-column-reference:
        role: sql_result_column
        target_kinds: [ sql_result_column ]
    detail-dataset-reference:
        qualifier: MODEL
        qualifier-form: keyword
        qualifier-case-sensitive: false
        role: dataset_name
        target_kinds: [ dataset ]

x-dml-formula-defaults:
    runtime-placeholder: &formula_runtime_placeholder dim_dt
    column-context: &formula_col_context
        refs:
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: { inherit: x-dml-column-datasets }, skip_values: [ *formula_runtime_placeholder ] }
            - { role: measure_name, target_kinds: *measure_target_kinds, skip_values: [ *formula_runtime_placeholder ] }
    enclosing-dataset: &formula_enclosing
        refs:
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_enclosing, skip_values: [ *formula_runtime_placeholder ] }
            - { role: measure_name, target_kinds: *measure_target_kinds, skip_values: [ *formula_runtime_placeholder ] }
    fn-macro: &formula_fn_macro
        refs:
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ measure ], modifier_target: true }
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: { from: enclosing_object_key }, skip_values: [ *formula_runtime_placeholder, measure ] }
            - { role: measure_name, target_kinds: [ measure, atomic_measure ], skip_values: [ *formula_runtime_placeholder, measure ] }
    measure: &formula_measure
        refs:
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_measure, skip_values: [ *formula_runtime_placeholder ] }
            - { role: measure_name, target_kinds: *measure_target_kinds, skip_values: [ *formula_runtime_placeholder ] }
    materialize: &formula_materialize
        refs:
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, skip_values: [ *formula_runtime_placeholder ] }
            - { role: measure_name, target_kinds: *measure_target_kinds, skip_values: [ *formula_runtime_placeholder ] }
    query: &formula_query
        refs: &formula_query_refs
            - { role: dmx_variable, target_kinds: [ dmx_variable ], match_values: [ *formula_runtime_placeholder ] }
            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, skip_values: [ *formula_runtime_placeholder ] }
            - { role: measure_name, target_kinds: *measure_target_kinds, skip_values: [ *formula_runtime_placeholder ] }
            - { role: query_column, target_kinds: [ query_column ], scope: { from: enclosing_query }, skip_values: [ *formula_runtime_placeholder ] }
            - { role: filter_name, target_kinds: [ filter_name ], scope: { from: enclosing_query }, skip_values: [ *formula_runtime_placeholder ] }


type: [ object, "null" ]
additionalProperties: false
properties:
    # 可引入一个或多个其他 DML 文件
    includes: { type: array, uniqueItems: true, items: { type: string, x-dml-reference: { role: include_path, target_kinds: [ include_file ], "on": sequence_item } } }

    dialect:
        type: string

    # 列宏定义
    column-macros:
        x-dml-context: column-macros
        type: object
        additionalProperties: false
        properties:
            # 适用的数据集
            datasets:
                type: array
                uniqueItems: true
                items:
                    type: string
                    x-dml-reference: { role: dataset_name, target_kinds: [ dataset ], "on": sequence_item }


            # 列定义（共享于 column-macros.datasets[] 所列的全部 dataset）
            columns:
                allOf:
                    - { $ref: "#/definitions/columns" }
                x-dml-column-datasets: { datasets: { from: sibling_property, key: datasets, "on": sequence_item } }

            # 时间维度定义（keys = column names in sibling columns; values = granularity enum）
            dimensions[dt]:
                allOf:
                    - { $ref: "#/definitions/dimensions[dt]" }
                x-dml-column-datasets: { datasets: { from: sibling_property, key: datasets, "on": sequence_item } }

        patternProperties:
            # 对象名称 = dataset 范围键；其下列名继承该 mapping_key 为 datasets
            ? *global_object_name_pattern
            :
                allOf:
                    - { $ref: "#/definitions/columns" }
                x-dml-reference: { role: dataset_name, target_kinds: [ dataset ], "on": mapping_key }
                x-dml-column-datasets: { datasets: { from: enclosing_object_key } }

patternProperties:
    # 对象名称（全局）
    ? *global_object_name_pattern
    :
        if:   { type: string }
        then:
            type: string
            format: formula
            x-dml-anchor: { kind: measure, "on": mapping_key, datasets: { from: sibling_property, key: dataset, "on": scalar } }
            x-dml-formula: *formula_measure
        else:
            allOf:
                -   type: object
                    required: [ type ]
                -   $ref: "#/definitions/dml_global_object_by_type"

definitions:
    dml_global_object_by_type:
        allOf:
            -   if:
                    properties:
                        type: { const: dt-macro }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_dt_macro"
            -   if:
                    properties:
                        type: { const: fn-macro }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_fn_macro"
            -   if:
                    properties:
                        type: { const: dataset }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_dataset"
            -   if:
                    properties:
                        type: { const: measure }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_measure"
            -   if:
                    properties:
                        type: { const: materialize }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_materialize"
            -   if:
                    properties:
                        type: { const: query }
                    required: [ type ]
                then:
                    $ref: "#/definitions/dml_object_query"
            -   if:
                    properties:
                        type:
                            not:
                                enum: [ dt-macro, fn-macro, dataset, measure, materialize, query ]
                    required: [ type ]
                then: false

    dml_object_dt_macro:
        additionalProperties: false
        x-dml-anchor: { kind: dt_macro, "on": mapping_key }
        allOf:
            -   oneOf:
                    -   required: [ value ]
                    -   required: [ range ]
        properties:
            type: { const: dt-macro }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
            # 前置检查
            prerequisite: { type: string, format: formula, x-dml-formula: *formula_enclosing }
        
            # 日期宏可以展开为此取值表达式
            value: { type: string, format: formula, x-dml-formula: *formula_enclosing }
            # 或 日期宏可以展开为此取值范围
            range: { $ref: "#/definitions/range" }

    dml_object_fn_macro:
        additionalProperties: false
        required: [ formula ]
        x-dml-anchor: { kind: fn_macro, "on": mapping_key }
        properties:
            type: { const: fn-macro }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
            # 前置检查
            prerequisite: { type: string, format: formula, x-dml-formula: *formula_enclosing }
        
            # 取值表达式
            formula: { type: string, format: formula, x-dml-formula: *formula_fn_macro }

    dml_object_dataset:
        additionalProperties: false
        x-dml-anchor: { kind: dataset, "on": mapping_key }
        allOf:
            # Measure-only datasets (no dimension columns) are valid; require at least one of
            # columns / measures. Do not emit bare `columns:` (YAML null) — omit the key instead.
            -   anyOf:
                    -   required: [ columns ]
                    -   required: [ measures ]
            -   oneOf:
                    -   required: [ table ]
                    -   required: [ sql ]
            -   not:
                    required: [ table, sql ]

        properties:
            type: { const: dataset }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
        
            # 表名
            table: { type: string }
            # 或取数 sql
            sql:
                type: string
                x-dml-reference:
                    role: dataset_name
                    target_kinds: [ dataset ]
                    "on": sql_curly_token
                    skip_values: [ QUERY ]
            # Dataset dimension：完整 dimension field 值组合声明 source-row identity，并派生 dataset grain
            dimension:
                type: array
                uniqueItems: true
                items:
                    type: string
                    x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: { from: enclosing_object_key }, "on": sequence_item }
            # 对应的物化表名（声明/定义 materialize 名称，非引用）
            materialize:
                if:   { type: string }
                then:
                    type: string
                    x-dml-anchor: { kind: materialize, "on": scalar, datasets: { from: enclosing_object_key } }
                else:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                        name: { type: string, x-dml-anchor: { kind: materialize, "on": scalar, datasets: { from: enclosing_object_key } } }
                        allows: { $ref: "#/definitions/allows_materialize_list" }
                        parameters:
                            allOf:
                                - { $ref: "#/definitions/unnamedParameters" }
                            x-dml-column-datasets: { datasets: *col_ds_enclosing }
            # Never supported on dataset (N3). Explicit rejected property so validators
            # name `filters` (not a bare additionalProperties miss). Completion skips not: {}.
            filters:
                description: >-
                    Unsupported on type: dataset. Relocate predicates to query filters:
                    (report scope), a measure or intermediate-column gate (eligibility),
                    or dataset sql: WHERE (permanent population / N2 escape).
                not: {}
            # 特定数据集的列定义，也可通过column-macro针对多个数据集同时进行列定义）
            columns:
                allOf:
                    - { $ref: "#/definitions/columns" }
                x-dml-column-datasets: { datasets: { from: enclosing_object_key } }
            # 时间维度定义
            dimensions[dt]:
                allOf:
                    - { $ref: "#/definitions/dimensions[dt]" }
                x-dml-column-datasets: { datasets: { from: enclosing_object_key } }
            # 数据集中的原子指标
            measures: { $ref: "#/definitions/dataset_measures" }

    dml_object_measure:
        additionalProperties: false
        required: [formula]
        x-dml-anchor: { kind: measure, "on": mapping_key, datasets: { from: sibling_property, key: dataset, "on": scalar } }
        
        properties:
            type: { const: measure }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
            # 前置检查
            prerequisite: { type: string, format: formula, x-dml-formula: *formula_measure }
        
            # 取值表达式
            formula: { type: string, format: formula, x-dml-formula: *formula_measure }
            # 指标的数据来源表
            dataset: { type: string, x-dml-reference: { role: dataset_name, target_kinds: [ dataset ], "on": scalar } }
            # Allowed dimensions：仅 array-of-arrays；每个内层列表是一个允许的 evaluation dimension。
            # 它不声明 dataset identity，也不产生 query GROUP BY。
            # 省略或使用 [[...]] = 任意兼容 dimension；[brand_id, ...] = 必须含 brand_id，允许附加 fields；
            # 封闭内层列表只允许其列出的完整 dimension，编译器校验 query、公式与 modifier 的兼容性。
            dimensions:
                type: array
                uniqueItems: true
                items:
                    type: array
                    uniqueItems: true
                    items:
                        type: string
                        x-dml-reference:
                            - { role: dmx_variable, target_kinds: [ dmx_variable ], "on": sequence_item, match_values: [ *formula_runtime_placeholder ] }
                            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_measure, "on": sequence_item, skip_values: [ *formula_runtime_placeholder ] }

    dml_object_materialize:
        additionalProperties: false
        x-dml-anchor: { kind: materialize, "on": mapping_key, datasets: { from: sibling_property, key: dataset, "on": scalar } }
        oneOf:
            -   required: [ dimension, measures ]
            -   required: [ dataset, dimension, dimension_columns ]
            -   required: [ dataset ]
                not:
                    anyOf:
                    - required: [dimension]
                    - required: [dimension_columns]
        
        properties:
            type: { const: materialize }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
        
            # 允许使用的物化表
            allows: { $ref: "#/definitions/allows_materialize_list" }
        
            # 物化表的更新通过存储过程实现，设置该存储过程的参数
            parameters: { $ref: "#/definitions/unnamedParametersMaterialize" }
        
            # 筛选条件
            filters: { $ref: "#/definitions/anonymousFiltersMaterialize" }
            dataset: { type: string, x-dml-reference: { role: dataset_name, target_kinds: [ dataset ], "on": scalar } }
            # Materialization dimension：这些 dimension fields 决定物化分组和 key，并派生 materialization grain
            dimension:
                type: array
                uniqueItems: true
                items:
                    type: string
                    x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, "on": sequence_item }
            # 从 materialization dimension fields 函数依赖得到的属性列；不属于 dimension 本身
            dimension_columns:
                type: object
                additionalProperties: false
        
                patternProperties:
                    "^(?!dimension)(.*)$":
                        # Shared by empty inherit (value_empty) and object inherit (not_has formula).
                        # Must sit above if/then/else so path context matches both reference sites.
                        x-dml-context: materialize-dimension-column
                        if:   { type: [ string, "null" ] }
                        then:
                            type: [ string, "null" ]
                            format: formula
                            x-dml-formula: *formula_materialize
                            x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, "on": mapping_key, when: { value_empty: true } }
                        else:
                            type: object
                            additionalProperties: false
                            x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, "on": mapping_key, when: { not_has: formula } }
                            properties:
                                # 维度属性简称
                                abbr: { type: string }
                                # 维度属性描述
                                description: { type: string }
                                # 维度属性取值表达式， 没有指定表达式时，从指标来源的dataset中获取相应字段的表达式
                                formula: { type: string, format: formula, x-dml-formula: *formula_materialize }
        
            # 需物化的指标列表
            measures:
                type: array
                uniqueItems: true
                items:
                    type: string
                    x-dml-reference: { role: measure_name, target_kinds: *measure_target_kinds, "on": sequence_item }

    dml_object_query:
        additionalProperties: false
        required: [ columns ]
        x-dml-anchor: { kind: query, "on": mapping_key }
        properties:
            type: { const: query }
        
            # 对象简称
            abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
            # 对象标签
            tags: { type: array, uniqueItems: true, items: { type: string } }
            # 对象描述
            description: { type: string }
        
            # 允许使用的物化表
            allows:
                if:   { type: array }
                then: { $ref: "#/definitions/allows_materialize_list" }
                else:
                    type: [ string ]
                    enum: [ "ALL", "NONE" ]
                    x-dml-reference: { role: materialize_name, target_kinds: [ materialize ], "on": scalar, skip_values: [ALL, NONE] }
        
            # 筛选条件定义
            filters:
                type: object
                additionalProperties: false
        
                patternProperties:
                    # 筛选条件名称（没有指定筛选列名时作为筛选列名），默认值为筛选值、值列表或值范围
                    ".*":
                        x-dml-anchor: { kind: filter_name, "on": mapping_key, scope: { from: enclosing_query } }
                        x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, "on": mapping_key, when: { implicit_column_from_key: column } }
                        x-dml-formula: { "on": mapping_key, refs: *formula_query_refs }
                        allOf:
                            - if: { type: number }
                              then:
                                  type: number
                            - if: { type: [ string, "null" ] }
                              then:
                                  type: [ string, "null" ]
                                  format: formula
                                  x-dml-formula: *formula_query
                            - if: { type: object }
                              then:
                                  type: object
                                  additionalProperties: false
                                  properties:
                                      # 筛选列，没有指定列名时取筛选名称作为列名
                                      column: { type: string, x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, "on": scalar } }
                                      # 允许的值
                                      value:
                                          allOf:
                                              - if: { type: number }
                                                then: { type: number }
                                              - if: { type: array }
                                                then: { $ref: "#/definitions/filterNumberOrStringList" }
                                              - if: { type: string }
                                                then: { type: string, format: formula, x-dml-formula: *formula_query }
                                              - if:
                                                    not:
                                                        anyOf:
                                                            - { type: number }
                                                            - { type: array }
                                                            - { type: string }
                                                then: false
                                      # 或允许的取值范围
                                      range: { $ref: "#/definitions/range" }
                                      # 此筛选条件的显示状态：可见，隐藏
                                      visibility: { $ref: "#/definitions/visibility" }
                                      # 此筛选条件的默认状态
                                      default:
                                          enum: [ on, off ]
                            - if: { type: array }
                              then: { $ref: "#/definitions/filterNumberOrStringList" }
                            # catch-all
                            - if:
                                  not:
                                      anyOf:
                                          - { type: number }
                                          - { type: [ string, "null" ] }
                                          - { type: object }
                                          - { type: array }
                              then: false
            dataset: { type: string, x-dml-reference: { role: dataset_name, target_kinds: [ dataset ], "on": scalar } }
            # 可以定义数据集中的列（针对特定数据集定义，或通过column-macro针对多个数据集定义），也可以定义报表中需要输出的列
            columns:
                x-dml-context: query-columns
                type: object
                additionalProperties: false
                properties:
                    # 查询输出分组维度（= SQL 的 GROUP BY；与 dataset 粒度声明、measure 粒度约束均不同）
                    dimension:
                        type: array
                        items:
                            if:   { type: [ string, "null" ] }
                            then:
                                type: [ string, "null" ]
                                x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, "on": sequence_item }
                            else:
                                # 也可以是列定义（列表项 mapping key = 列名，如 - dist_id: {visibility: hidden}）
                                # 属性须写在列名映射值内；同级 sibling visibility/formula（缩进错误）为非法。
                                type: object
                                additionalProperties: false
                                minProperties: 1
                                maxProperties: 1
                                patternProperties:
                                    # 列名（禁止把 visibility/formula 当成列名挂在列表项同级）
                                    "^(?!visibility$|formula$).+$":
                                        x-dml-anchor: { kind: query_column, "on": mapping_key, scope: { from: enclosing_query } }
                                        # 空值或未提供 formula 时继承同名输入列；显式公式的 key 是 query 输出名。
                                        x-dml-reference:
                                            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, "on": mapping_key, when: { value_empty: true } }
                                            - { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_query, "on": mapping_key, when: { not_has: formula } }
                                        allOf:
                                            - if: { type: "null" }
                                              then: { type: "null" }
                                            - if: { type: string }
                                              then:
                                                  type: string
                                                  format: formula
                                                  x-dml-formula: *formula_query
                                            - if: { type: object }
                                              then:
                                                  type: object
                                                  additionalProperties: false
                                                  properties:
                                                      # 列取值表达式
                                                      formula: { type: string, format: formula, x-dml-formula: *formula_query }
                                                      # 列显示状态：可见，隐藏
                                                      visibility: { $ref: "#/definitions/visibility" }
                patternProperties:
                    # 不作为维度的列名（query 输出列定义位）
                    "^(?!dimension$).+$":
                        x-dml-anchor: { kind: query_column, "on": mapping_key, scope: { from: enclosing_query } }
                        # 空值或未提供 formula 时继承同名输入列/指标；显式公式的 key 是 query 输出名。
                        x-dml-reference:
                            - { role: query_output_source, unresolved: authoritative, target_kinds: [ measure, atomic_measure, column_name ], datasets: *col_ds_query, "on": mapping_key, when: { value_empty: true } }
                            - { role: query_output_source, unresolved: authoritative, target_kinds: [ measure, atomic_measure, column_name ], datasets: *col_ds_query, "on": mapping_key, when: { not_has: formula } }
                        allOf:
                            - if: { type: [ string, "null" ] }
                              then:
                                  type: [ string, "null" ]
                                  format: formula
                                  x-dml-formula: *formula_query
                            - if: { type: number }
                              then: { type: number }
                            - if: { type: object }
                              then:
                                  type: object
                                  additionalProperties: false
                                  properties:
                                      # 列描述
                                      description: { type: string }
                                      # 列取值表达式
                                      formula: { type: string, format: formula, x-dml-formula: *formula_query }
                                      # 列显示状态：可见，隐藏
                                      visibility: { $ref: "#/definitions/visibility" }
            # 后期处理SQL
            after: { type: string }

    anonymousFiltersMaterialize:
        type: object
        additionalProperties: false
        patternProperties:
            ".*":
                x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, "on": mapping_key }
                allOf:
                    - { $ref: "#/definitions/anonymousFilterValue" }

    anonymousFilterValue:
        if:   { type: object }
        then:
            type: object
            additionalProperties: false
            oneOf:
                - required: [ value ]
                - required: [ range ]
            properties:
                value: { $ref: "#/definitions/anonymousFilterOperand" }
                range: { $ref: "#/definitions/range" }
        else:
            $ref: "#/definitions/anonymousFilterOperand"

    anonymousFilterOperand:
        allOf:
            - if: { type: number }
              then: { type: number }
            - if: { type: [ string, "null" ] }
              then: { type: [ string, "null" ] }
            - if: { type: array }
              then: { $ref: "#/definitions/filterNumberOrStringList" }

    # Shared filter / allows / parameter fragments (SSOT)
    filterNumberOrStringList:
        oneOf:
            - { type: array, uniqueItems: true, items: { type: number } }
            - { type: array, uniqueItems: true, items: { type: string } }

    visibility:
        enum: [ visible, hidden ]

    allows_materialize_list:
        type: array
        uniqueItems: true
        items:
            type: string
            x-dml-reference:
                role: materialize_name
                target_kinds: [ materialize ]
                "on": sequence_item
                skip_values: [ ALL, NONE ]

    unnamedParameterValue:
        if:   { type: [ string, "null" ] }
        then: { type: [ string, "null" ] }
        else: { type: array, uniqueItems: true, items: { type: string } }

    # 参数定义（dataset.materialize.parameters 使用 unnamedParameters + x-dml-column-datasets）
    unnamedParameters:
        type: object
        additionalProperties: false

        patternProperties:
            # 参数对应的筛选列名
            ".*":
                $ref: "#/definitions/unnamedParameterValue"

    unnamedParametersMaterialize:
        type: object
        additionalProperties: false

        patternProperties:
            # 参数对应的筛选列名
            ".*":
                x-dml-reference: { role: column_name, target_kinds: [ column_name ], datasets: *col_ds_maz, "on": mapping_key }
                allOf:
                    - { $ref: "#/definitions/unnamedParameterValue" }

    # 列定义（datasets 由父级 x-dml-column-datasets 提供）
    # Detail window functions (SUM/LAG/… OVER, no GROUP BY) belong here as calculated columns —
    # nested before outer aggregation. Post-aggregation windows (share/rank with {-d:}/{dimension:})
    # belong on composite measures (top-level type: measure, no dataset:), not on atomic measures.
    columns:
        type: object
        additionalProperties: false
        patternProperties:
            # 列名称（全局）
            ? *global_object_name_pattern
            :
                x-dml-context: column
                x-dml-anchor: { kind: column_name, "on": mapping_key, datasets: { inherit: x-dml-column-datasets } }
                allOf:
                    - if: { type: [ string, "null" ] }
                      then:
                          type: [ string, "null" ]
                          format: formula
                          x-dml-formula: *formula_col_context
                    - if: { type: number }
                      then: { type: number }
                    - if: { type: object }
                      then:
                          type: object
                          additionalProperties: false
                          # formula、source 中最多出现一个
                          not:
                              required: [ formula, source ]
                          properties:
                              # 列简称
                              abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
                              # 列标签
                              tags: { type: array, uniqueItems: true, items: { type: string } }
                              # 列描述
                              description: { type: string }
                              # 取值表达式
                              # `formula: {column_name}` is parsed by YAML as a flow mapping
                              # (object), not a string. The `type: [string, number]` constraint
                              # catches this with a single clear error: "must be [string, number]".
                              formula:
                                  type: [string, number]
                                  if:   { type: string }
                                  then: { type: string, format: formula, x-dml-formula: *formula_col_context }
                              # formula: {type: string, format: formula}
                              # 来源公式：对于字段，可以设置字段的数据来源公式，根据公式推算的值和实际值必须一致
                              source: { type: string, format: formula, x-dml-formula: *formula_col_context }
                              # 前置检查
                              prerequisite: { type: string, format: formula, x-dml-formula: *formula_col_context }

    # 时间维度定义（mapping key = column_name in scoped columns; value = granularity enum）
    dimensions[dt]:
        type: object
        additionalProperties: false
        patternProperties:
            ".*":
                x-dml-value-context: dt-granularity
                x-dml-reference:
                    role: column_name
                    target_kinds: [ column_name ]
                    datasets: { inherit: x-dml-column-datasets }
                    "on": mapping_key
                enum: [ year, quarter, month, week, date, hour ]

    # 数据集中的原子指标定义（atomic measure；与顶层 type: measure + dataset: 同一概念）
    # Plain column aggregates only (SUM({qty}), DISTINCTCOUNTIF(...), …).
    # Atomic measures must not use window functions:
    #   - Detail OVER on columns (no GROUP BY) → calculated column under columns:, then atomic agg.
    #   - Post-GROUP-BY window on measures → transitional atomic agg + composite window / {-d:}/{-df:}.
    # Composite measures (top-level type: measure, no dataset:) may use window functions.
    # MRE + H2 bag parity: docs/prd/mre/window-placement/
    dataset_measures:
        type: object
        additionalProperties: false
        patternProperties:
            # 列名称（全局）
            ? *global_object_name_pattern
            :
                x-dml-context: atomic_measure
                x-dml-anchor: { kind: atomic_measure, "on": mapping_key, datasets: { from: enclosing_object_key } }
                if:   { type: [ string, "null" ] }
                then:
                    type: [ string, "null" ]
                    format: formula
                    x-dml-formula: *formula_enclosing
                else:
                    # 列定义
                    type: object
                    additionalProperties: false
                    # required: [formula]
                    properties:
                        # 对象简称
                        abbr: { type: string, x-dml-alias: { target: enclosing_anchor, "on": scalar } }
                        # 对象标签
                        tags: { type: array, uniqueItems: true, items: { type: string } }
                        # 对象描述
                        description: { type: string }
                        # 前置检查
                        prerequisite: { type: string, format: formula, x-dml-formula: *formula_enclosing }

                        # 取值表达式
                        formula: { type: string, format: formula, x-dml-formula: *formula_enclosing }

                        # Allowed dimensions，与全局 measure.dimensions 同形：每个内层列表是一个 dimension。
                        # 它不声明 enclosing dataset 的 identity，也不产生 query GROUP BY。
                        # 省略或使用 [[...]] = 任意兼容 dimension；[brand_id, ...] = 必须含 brand_id，允许附加 fields；
                        # 封闭内层列表只允许其列出的完整 dimension。
                        dimensions:
                            type: array
                            uniqueItems: true
                            items:
                                type: array
                                uniqueItems: true
                                items:
                                    type: string
                                    x-dml-reference:
                                        - { role: dmx_variable, target_kinds: [ dmx_variable ], "on": sequence_item, match_values: [ *formula_runtime_placeholder ] }
                                        - { role: column_name, target_kinds: [ column_name ], datasets: { from: enclosing_object_key }, "on": sequence_item, skip_values: [ *formula_runtime_placeholder ] }

    # 范围定义
    range:
        type: array
        # uniqueItems: true
        items:
            if:   { type: number }
            then: { type: number }
            else: { type: string, format: formula, x-dml-formula: *formula_enclosing }
        minItems: 2
        maxItems: 2
